{% extends 'base.html' %}
{% block content %}
<div class="row mb-4">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <h2 class="mb-2">
          <i class="bi bi-envelope-paper me-2"></i>Cover Letter Preview
        </h2>
        <p class="text-muted mb-0">{{ coverletter.title }}</p>
      </div>
      <div class="mt-3 mt-md-0 d-flex gap-2">
        <button class="btn btn-primary export-pdf-btn" data-target="coverletter-content" data-filename="{{ coverletter.title|replace(' ', '_') }}.pdf">
          <i class="bi bi-file-earmark-pdf me-2"></i>Download PDF
        </button>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 bg-light rounded">
        <div id="coverletter-content" class="bg-white p-4 p-md-5 shadow-sm rounded border" style="min-height: 500px; max-width: 100%; overflow: hidden;">
          <div style="white-space: pre-wrap; word-wrap: break-word; word-break: break-word; font-family: 'Times New Roman', Times, serif; color: #333; font-size: 11pt; line-height: 1.6;">{{ coverletter.content }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
